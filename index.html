<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big things coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.1/delaunator.min.js"></script>
<style>
  :root {
    --bg: #081729;
    --ink: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    font-family: "League Spartan", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 60vmin;
    height: 60vmin;
    min-width: 60vw;
    min-height: 60vh;
    display: grid;
    place-items: center;
  }
  .word, .logo {
    position: absolute;
    opacity: 0;
    animation-duration: 4s;
    animation-iteration-count: infinite;
    animation-timing-function: step-end;
  }
  .word {
    color: var(--ink);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: calc(0.02em - 2px);
    line-height: 1;
    font-size: min(15vw, 30vh);
    white-space: nowrap;
  }
  .logo {
    width: min(60vw, 60vh);
    height: min(60vw, 60vh);
    object-fit: contain;
  }
  /* 8 slots of 0.5s each: 4 words, then logo for 2s (4 slots) */
  .w1 { animation-name: s1; }
  .w2 { animation-name: s2; }
  .w3 { animation-name: s3; }
  .w4 { animation-name: s4; }
  .logo { animation-name: s5; }
  @keyframes s1 { 0% { opacity: 1; } 12.5% { opacity: 0; } }
  @keyframes s2 { 0%, 12.4% { opacity: 0; } 12.5% { opacity: 1; } 25% { opacity: 0; } }
  @keyframes s3 { 0%, 24.9% { opacity: 0; } 25% { opacity: 1; } 37.5% { opacity: 0; } }
  @keyframes s4 { 0%, 37.4% { opacity: 0; } 37.5% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes s5 { 0%, 49.9% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .word, .logo { animation-duration: 12s; }
  }

  body.hot { cursor: pointer; }
  body.stopped .word, body.stopped .logo { animation: none !important; opacity: 0 !important; }
  .fx {
    position: fixed;
    margin: 0;
    z-index: 10;
    font-family: "League Spartan", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: calc(0.02em - 2px);
    line-height: 1;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
  }
  .tile { position: absolute; opacity: 0; animation: pop 0.45s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
  .grab { cursor: grab; touch-action: none; }
  .grab.held { cursor: grabbing; }
  .po { display: inline-block; opacity: 0; animation: pop 0.45s cubic-bezier(.2,1.4,.4,1) forwards; }
  .tun { left: var(--vx, 50%); top: var(--vy, 50%); color: transparent; -webkit-text-stroke: 3px var(--c); opacity: 0; pointer-events: none; }
  @keyframes tz { from { transform: translate(-50%, -50%) scale(0.03); } to { transform: translate(-50%, -50%) scale(10); } }
  @keyframes tf { 0% { opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
  body.pile { cursor: grab; }
</style>
</head>

  <script>
    // Logo flame palette; each word gets a different random colour, reshuffled every loop.
    const palette = ["#ffd91a", "#ffb000", "#ff8a1f", "#f2611d", "#e8301c", "#d4141c"];
    const words = document.querySelectorAll(".word");
    function recolor() {
      const p = palette.slice().sort(() => Math.random() - 0.5);
      words.forEach((w, i) => { w.style.color = p[i]; });
    }
    recolor();

    document.querySelector(".logo").addEventListener("animationiteration", recolor);

    // ---- Click interactions ----
    let done = false;
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = () => palette[Math.floor(Math.random() * palette.length)];

    function activeWord() {
      return [...words, document.querySelector(".logo")].find(w => parseFloat(getComputedStyle(w).opacity) > 0.5);
    }
    function hit(e) {
      const w = activeWord();
      if (!w) return null;
      const r = w.getBoundingClientRect(), pad = 12;
      const inside = e.clientX >= r.left - pad && e.clientX <= r.right + pad &&
                     e.clientY >= r.top - pad && e.clientY <= r.bottom + pad;
      return inside ? w : null;
    }
    function makeFx(text, size, color, left, top) {
      const el = document.createElement("div");
      el.className = "fx";
      el.textContent = text;
      el.style.fontSize = size;
      el.style.color = color;
      el.style.left = left + "px";
      el.style.top = top + "px";
      document.body.appendChild(el);
      return el;
    }

    // BIG: zoom tunnel, nested BIGs flying toward you from the click point
    function fxBig(info, e) {
      const N = 9, DUR = 5;
      const layer = document.createElement("div");
      layer.style.cssText = "position:fixed;inset:0;overflow:hidden;z-index:10;pointer-events:none";
      let vx = e.clientX, vy = e.clientY, tx = vx, ty = vy;
      for (let i = 0; i < N; i++) {
        const t = document.createElement("div");
        t.className = "fx tun";
        t.textContent = "Big";
        t.style.fontSize = info.size;
        t.style.setProperty("--c", palette[i % palette.length]);
        t.style.animation = `tz ${DUR}s cubic-bezier(.7,0,.95,.5) ${-i * DUR / N}s infinite, tf ${DUR}s linear ${-i * DUR / N}s infinite`;
        layer.appendChild(t);
      }
      document.body.appendChild(layer);
      // the vanishing point drifts toward the cursor
      addEventListener("pointermove", ev => { tx = ev.clientX; ty = ev.clientY; });
      (function steer() {
        vx += (tx - vx) * 0.06; vy += (ty - vy) * 0.06;
        layer.style.setProperty("--vx", vx + "px");
        layer.style.setProperty("--vy", vy + "px");
        requestAnimationFrame(steer);
      })();
    }

    // THINGS: drops to the floor, then can be dragged and thrown
    function fxThingsSimple(info) {
      const el = makeFx("Things", info.size, info.color, info.rect.left, info.rect.top);
      el.classList.add("grab");
      const w = el.offsetWidth, h = el.offsetHeight;
      let x = info.rect.left, y = info.rect.top, vx = 0, vy = 0;
      let held = false, ox = 0, oy = 0, last = performance.now();
      const G = 2400, BOUNCE = 0.38;

      function tick(now) {
        const dt = Math.min((now - last) / 1000, 0.033);
        last = now;
        if (!held) {
          vy += G * dt;
          x += vx * dt; y += vy * dt;
          const floor = innerHeight - h, right = innerWidth - w;
          if (y > floor) { y = floor; vy = Math.abs(vy) > 160 ? -vy * BOUNCE : 0; vx *= 0.9; }
          if (y < 0) { y = 0; vy = Math.abs(vy) * BOUNCE; }
          if (x < 0) { x = 0; vx = Math.abs(vx) * BOUNCE; }
          if (x > right) { x = right; vx = -Math.abs(vx) * BOUNCE; }
          if (y >= floor) vx *= 1 - Math.min(1, 6 * dt);
        }
        el.style.left = x + "px"; el.style.top = y + "px";
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(t => { last = t; tick(t); });

      let px = 0, py = 0, pt = 0;
      el.addEventListener("pointerdown", e => {
        held = true; el.classList.add("held");
        el.setPointerCapture(e.pointerId);
        ox = e.clientX - x; oy = e.clientY - y;
        px = e.clientX; py = e.clientY; pt = performance.now();
        vx = vy = 0;
      });
      el.addEventListener("pointermove", e => {
        if (!held) return;
        x = e.clientX - ox; y = e.clientY - oy;
        const now = performance.now(), dt = Math.max((now - pt) / 1000, 0.001);
        vx = 0.6 * vx + 0.4 * (e.clientX - px) / dt;
        vy = 0.6 * vy + 0.4 * (e.clientY - py) / dt;
        px = e.clientX; py = e.clientY; pt = now;
      });
      const release = () => {
        if (!held) return;
        held = false; el.classList.remove("held");
        const cap = 3000;
        vx = Math.max(-cap, Math.min(cap, vx));
        vy = Math.max(-cap, Math.min(cap, vy));
        if (performance.now() - pt > 80) vx = vy = 0;
      };
      el.addEventListener("pointerup", release);
      el.addEventListener("pointercancel", release);
    }

    // THINGS: physics pile-up. Drag and throw, click empty space to drop more.
    function fxThings(info) {
      if (typeof Matter === "undefined") return fxThingsSimple(info);
      const { Engine, Runner, Bodies, Body, Composite, Events, Mouse, MouseConstraint, Query } = Matter;
      const engine = Engine.create();
      engine.gravity.y = 1.4;
      const world = engine.world;
      const T = 400;
      const floor = Bodies.rectangle(innerWidth / 2, innerHeight + T / 2, innerWidth * 6, T, { isStatic: true });
      const wallL = Bodies.rectangle(-T / 2, innerHeight / 2 - 3000, T, 12000, { isStatic: true });
      const wallR = Bodies.rectangle(innerWidth + T / 2, innerHeight / 2 - 3000, T, 12000, { isStatic: true });
      Composite.add(world, [floor, wallL, wallR]);
      addEventListener("resize", () => {
        Body.setPosition(floor, { x: innerWidth / 2, y: innerHeight + T / 2 });
        Body.setPosition(wallR, { x: innerWidth + T / 2, y: innerHeight / 2 - 3000 });
        Body.setPosition(wallL, { x: -T / 2, y: innerHeight / 2 - 3000 });
      });

      const items = [];
      const baseSize = parseFloat(info.size);
      function spawn(x, y, size, color, angle, vx, vy) {
        const el = makeFx("Things", size + "px", color, 0, 0);
        el.style.willChange = "transform";
        const w = el.offsetWidth, h = el.offsetHeight;
        const body = Bodies.rectangle(x, y, w, h * 0.78, {
          restitution: 0.3, friction: 0.7, frictionAir: 0.008, density: 0.002,
          chamfer: { radius: h * 0.12 }
        });
        Body.setAngle(body, angle);
        Body.setVelocity(body, { x: vx, y: vy });
        Composite.add(world, body);
        items.push({ el, body, w, h });
      }
      spawn(info.rect.left + info.rect.width / 2, info.rect.top + info.rect.height / 2, baseSize, info.color, 0, 0, 0);

      Events.on(engine, "afterUpdate", () => {
        for (const it of items) {
          const p = it.body.position;
          it.el.style.transform = `translate(${p.x - it.w / 2}px,${p.y - it.h / 2}px) rotate(${it.body.angle}rad)`;
        }
      });

      const mouse = Mouse.create(document.body);
      const mc = MouseConstraint.create(engine, { mouse, constraint: { stiffness: 0.2, render: { visible: false } } });
      Composite.add(world, mc);
      document.body.style.touchAction = "none";
      document.body.classList.add("pile");

      addEventListener("pointerdown", e => {
        if (Query.point(items.map(i => i.body), { x: e.clientX, y: e.clientY }).length) return;
        spawn(e.clientX, -90, baseSize * rand(0.5, 1.05), pick(), rand(-0.6, 0.6), rand(-3, 3), rand(0, 4));
        if (items.length > 70) {
          const old = items.shift();
          Composite.remove(world, old.body);
          old.el.remove();
        }
      });
      Runner.run(Runner.create(), engine);
    }

    // COMING: letters explode, then get pulled into orbit around the cursor
    function fxComing(info, e) {
      const box = makeFx("", info.size, info.color, info.rect.left, info.rect.top);
      const spans = [..."Coming"].map(ch => {
        const s = document.createElement("span");
        s.textContent = ch;
        s.style.display = "inline-block";
        box.appendChild(s);
        return s;
      });
      const rects = spans.map(s => s.getBoundingClientRect());
      const fl = spans.map(() => ({ k: rand(0.7, 2.0), a: rand(-200, 200) }));
      spans.forEach((s, i) => {
        const r = rects[i];
        s.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;display:inline-block;color:${pick()};` +
          "will-change:transform;transition:transform 1s cubic-bezier(.1,.9,.2,1)";
        document.body.appendChild(s);
        s.className = "fx";
        s.style.fontSize = info.size;
      });
      box.remove();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        spans.forEach((s, i) => {
          const r = rects[i], { k, a } = fl[i];
          const tx = rand(0, innerWidth - r.width * k) - r.left;
          const ty = rand(0, innerHeight - r.height * k) - r.top;
          s.style.transform = `translate(${tx}px,${ty}px) rotate(${a}deg) scale(${k})`;
        });
      }));

      // after the blast, hand each letter to a spring that orbits the cursor
      const m = { x: innerWidth / 2, y: innerHeight / 2 };
      addEventListener("pointermove", ev => { m.x = ev.clientX; m.y = ev.clientY; });
      setTimeout(() => {
        const ps = spans.map((s, i) => {
          const b = s.getBoundingClientRect(), w = rects[i].width, h = rects[i].height;
          s.style.transition = "none";
          s.style.left = "0px"; s.style.top = "0px";
          const ks = rand(10, 26);
          return {
            s, w, h, x: b.left + b.width / 2, y: b.top + b.height / 2, vx: 0, vy: 0,
            k: fl[i].k, a: fl[i].a, spin: rand(-120, 120),
            R: rand(70, 230), th: rand(0, 6.28), om: rand(0.6, 1.6) * (Math.random() < 0.5 ? -1 : 1),
            ks, c: 2 * Math.sqrt(ks) * 0.45
          };
        });
        addEventListener("pointerdown", () => {
          ps.forEach(p => {
            const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy) || 1;
            p.vx += dx / d * 1000 + rand(-200, 200);
            p.vy += dy / d * 1000 + rand(-200, 200);
          });
        });
        let last = performance.now();
        (function loop(now) {
          const dt = Math.min((now - last) / 1000, 0.033); last = now;
          const t = now / 1000;
          for (const p of ps) {
            const gx = m.x + p.R * Math.cos(p.th + p.om * t), gy = m.y + p.R * Math.sin(p.th + p.om * t);
            p.vx += (p.ks * (gx - p.x) - p.c * p.vx) * dt;
            p.vy += (p.ks * (gy - p.y) - p.c * p.vy) * dt;
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.a += p.spin * dt;
            p.s.style.transform = `translate(${p.x - p.w / 2}px,${p.y - p.h / 2}px) rotate(${p.a}deg) scale(${p.k})`;
          }
          requestAnimationFrame(loop);
        })(last);
      }, 1100);
    }

    // SOON: O's push the N off, it loops round, rows of O's cascade, then every row scrolls as a marquee
    function fxSoon(info) {
      const el = makeFx("", info.size, info.color, info.rect.left, info.rect.top);
      const part = (t, c) => { const s = document.createElement("span"); s.textContent = t; s.style.color = c; return s; };
      const tail = part("N", info.color);
      el.append(part("S", info.color), part("O", info.color), part("O", info.color), tail);
      const timer = setInterval(() => {
        el.insertBefore(part("O", pick()), tail);
        if (tail.getBoundingClientRect().left > innerWidth + 150) {
          clearInterval(timer);
          loopN();
        }
      }, 40);

      // one scrolling row: two identical copies side by side, slid by exactly one copy's width
      function buildRow(items, left, top, dir, speed, popBase) {
        const wrap = makeFx("", info.size, "#fff", left, top);
        wrap.style.willChange = "transform";
        const mk = () => {
          const g = document.createElement("span");
          g.style.display = "inline-block";
          items.forEach((it, j) => {
            const s = document.createElement("span");
            s.textContent = it.t;
            s.style.color = it.c;
            if (popBase != null) { s.className = "po"; s.style.animationDelay = (popBase + j * 0.03).toFixed(3) + "s"; }
            g.appendChild(s);
          });
          return g;
        };
        const g1 = mk();
        wrap.append(g1, mk());
        const W = g1.getBoundingClientRect().width;
        wrap.animate(
          [{ transform: "translateX(0)" }, { transform: `translateX(${-W}px)` }],
          { duration: W / speed * 1000, iterations: Infinity, direction: dir > 0 ? "normal" : "reverse" }
        );
        return wrap;
      }

      function loopN() {
        const nw = tail.getBoundingClientRect().width;
        tail.style.visibility = "hidden";
        const n = makeFx("N", info.size, info.color, -nw * 1.5, info.rect.top);
        n.style.transition = "left 0.7s cubic-bezier(.2,.9,.3,1)";
        const nLeft = info.rect.left - nw;
        requestAnimationFrame(() => requestAnimationFrame(() => { n.style.left = nLeft + "px"; }));
        setTimeout(() => { sproutLeft(nLeft, n); cascade(); }, 650);
      }

      function measureO() {
        const probe = makeFx("O", info.size, "#000", 0, 0);
        probe.style.visibility = "hidden";
        const r = probe.getBoundingClientRect();
        probe.remove();
        return { ow: r.width, oh: r.height };
      }

      // O's sprout leftwards from the N, then the whole row becomes a marquee
      function sproutLeft(nLeft, n) {
        const { ow } = measureO();
        const count = Math.ceil((nLeft + ow) / ow);
        const lefts = [], colours = [];
        for (let i = 1; i <= count; i++) {
          const c = pick();
          const o = makeFx("O", info.size, c, nLeft - i * ow, info.rect.top);
          o.classList.add("tile"); o.style.position = "fixed";
          o.style.animationDelay = (i * 0.04).toFixed(3) + "s";
          lefts.push(o); colours[count - i] = c;
        }
        setTimeout(() => {
          const rightOs = [...el.children].slice(1, -1).map(s => ({ t: "O", c: s.style.color }));
          const items = [
            ...colours.map(c => ({ t: "O", c })),
            { t: "N", c: info.color }, { t: "S", c: info.color },
            ...rightOs
          ];
          buildRow(items, nLeft - count * ow, info.rect.top, 1, 90);
          el.remove(); n.remove(); lefts.forEach(o => o.remove());
        }, count * 40 + 600);
      }

      function cascade() {
        const { ow, oh } = measureO();
        const cols = Math.ceil(innerWidth / ow) + 3;
        const above = Math.ceil(info.rect.top / oh), below = Math.ceil((innerHeight - info.rect.top) / oh);
        const ks = [];
        for (let k = -above; k <= below; k++) if (k !== 0) ks.push(k);
        ks.forEach((k, i) => {
          const items = Array.from({ length: cols }, () => ({ t: "O", c: pick() }));
          const dir = k % 2 === 0 ? 1 : -1;
          buildRow(items, -rand(0, ow), info.rect.top + k * oh, dir, 70 + (Math.abs(k) % 3) * 35, i * 0.12);
        });
      }
    }

    // LION: Delaunay-triangulate the logo PNG, shatter it, then snap it back together and resume the loop
    async function fxLion(info) {
      const img = document.querySelector(".logo");
      const bmp = new Image();
      bmp.src = img.src;
      await bmp.decode();
      const N = bmp.naturalWidth;
      const cv = document.createElement("canvas");
      cv.width = cv.height = N;
      const ctx = cv.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(bmp, 0, 0);
      const data = ctx.getImageData(0, 0, N, N).data;
      const isBg = (x, y) => {
        const i = (Math.min(N - 1, Math.max(0, Math.round(y))) * N + Math.min(N - 1, Math.max(0, Math.round(x)))) * 4;
        return Math.abs(data[i] - 8) < 10 && Math.abs(data[i + 1] - 23) < 10 && Math.abs(data[i + 2] - 41) < 10;
      };
      const url = URL.createObjectURL(await new Promise(r => cv.toBlob(r)));

      // jittered grid of points -> Delaunay triangles
      const G = 13, step = N / G, pts = [];
      for (let j = 0; j <= G; j++) {
        for (let i = 0; i <= G; i++) {
          let x = i * step, y = j * step;
          if (i > 0 && i < G) x += rand(-0.32, 0.32) * step;
          if (j > 0 && j < G) y += rand(-0.32, 0.32) * step;
          pts.push([x, y]);
        }
      }
      let tris = [];
      if (typeof Delaunator !== "undefined") {
        const t = Delaunator.from(pts).triangles;
        for (let i = 0; i < t.length; i += 3) tris.push([pts[t[i]], pts[t[i + 1]], pts[t[i + 2]]]);
      } else {
        for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
          const a = pts[j * (G + 1) + i], b = pts[j * (G + 1) + i + 1], c = pts[(j + 1) * (G + 1) + i], d = pts[(j + 1) * (G + 1) + i + 1];
          tris.push([a, b, c], [b, d, c]);
        }
      }
      // drop triangles that are pure background, they would be invisible anyway
      tris = tris.filter(t => {
        const cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
        const samples = [[cx, cy]];
        t.forEach(p => samples.push([cx + (p[0] - cx) * 0.5, cy + (p[1] - cy) * 0.5], [cx + (p[0] - cx) * 0.9, cy + (p[1] - cy) * 0.9]));
        return samples.some(([x, y]) => !isBg(x, y));
      });

      const { left, top, width: W, height: H } = info.rect;
      const k = W / N;
      const box = document.createElement("div");
      box.style.cssText = `position:fixed;left:${left}px;top:${top}px;width:${W}px;height:${H}px;z-index:10;pointer-events:none`;
      const shards = tris.map(t => {
        const cx = (t[0][0] + t[1][0] + t[2][0]) / 3 * k, cy = (t[0][1] + t[1][1] + t[2][1]) / 3 * k;
        // grow each triangle by ~0.7px so antialiasing leaves no hairline seams
        const poly = t.map(([x, y]) => {
          const px = x * k, py = y * k, d = Math.hypot(px - cx, py - cy) || 1;
          return `${(px + (px - cx) / d * 0.7).toFixed(2)}px ${(py + (py - cy) / d * 0.7).toFixed(2)}px`;
        }).join(",");
        const el = document.createElement("div");
        el.style.cssText = `position:absolute;inset:0;background:url(${url}) 0 0/100% 100% no-repeat;` +
          `clip-path:polygon(${poly});transform-origin:${cx}px ${cy}px;will-change:transform`;
        box.appendChild(el);
        const dx = cx - W / 2, dy = cy - H / 2, d = Math.hypot(dx, dy) || 1;
        const sp = rand(250, 900);
        return { el, x: 0, y: 0, a: 0, vx: dx / d * sp + rand(-120, 120), vy: dy / d * sp - rand(300, 900),
                 va: rand(-540, 540), delay: rand(0, 0.35) };
      });
      document.body.appendChild(box);
      document.body.animate([
        { transform: "translate(0,0)" }, { transform: "translate(-9px,5px)" }, { transform: "translate(8px,-6px)" },
        { transform: "translate(-5px,-4px)" }, { transform: "translate(0,0)" }
      ], { duration: 350 });

      const BURST = 2.0, BACK = 0.9, G_ACC = 2200;
      const t0 = performance.now();
      let last = t0, snap = false;
      (function frame(now) {
        const t = (now - t0) / 1000, dt = Math.min((now - last) / 1000, 0.033);
        last = now;
        if (t < BURST) {
          for (const s of shards) {
            s.vy += G_ACC * dt;
            s.x += s.vx * dt; s.y += s.vy * dt; s.a += s.va * dt;
          }
        } else {
          if (!snap) { snap = true; shards.forEach(s => { s.sx = s.x; s.sy = s.y; s.sa = s.a; }); }
          for (const s of shards) {
            const p = Math.min(1, Math.max(0, (t - BURST - s.delay) / BACK));
            const e = 1 - Math.pow(1 - p, 3);
            s.x = s.sx * (1 - e); s.y = s.sy * (1 - e); s.a = s.sa * (1 - e);
          }
        }
        shards.forEach(s => { s.el.style.transform = `translate(${s.x}px,${s.y}px) rotate(${s.a}deg)`; });
        if (t < BURST + 0.35 + BACK + 0.4) return requestAnimationFrame(frame);
        // back together: clean up and let the loop play again
        box.remove();
        URL.revokeObjectURL(url);
        [...words, img].forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
        recolor();
        document.body.classList.remove("stopped");
        done = false;
      })(t0);
    }

    const effects = { big: fxBig, things: fxThings, coming: fxComing, soon: fxSoon, lion: fxLion };

    addEventListener("mousemove", e => {
      if (!done) document.body.classList.toggle("hot", !!hit(e));
    });
    addEventListener("click", e => {
      if (done) return;
      const w = hit(e);
      if (!w) return;
      done = true;
      const info = {
        rect: w.getBoundingClientRect(),
        color: w.style.color,
        size: getComputedStyle(w).fontSize
      };
      document.body.classList.remove("hot");
      document.body.classList.add("stopped");
      effects[w.dataset.fx](info, e);
    });
  </script>
</body>
</html>
